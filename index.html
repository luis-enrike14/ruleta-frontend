    <title>Panel de Administración</title>
    <style>
      /* Oculta de forma absoluta el badge/drawer de Netlify */
      netlify-badge,
      #netlify-badge,
      [data-netlify-badge],
      .netlify-badge,
      div[class*="netlify"],
      iframe[src*="netlify"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
